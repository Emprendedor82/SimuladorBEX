<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13294B">
<title>Simulador de Liderazgo BEX · Una mañana cualquiera</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2313294B'/%3E%3Cpath d='M32 12l17 10v20L32 52 15 42V22z' fill='none' stroke='%23E87722' stroke-width='5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- jsPDF: única dependencia externa, necesaria solo para generar el PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>

<style>
/* =========================================================
   1. TOKENS
   ========================================================= */
:root{
  --navy:#13294B;
  --navy-2:#1B3963;
  --navy-deep:#0B1A31;
  --orange:#E87722;
  --orange-2:#CC6315;
  --orange-soft:#FDF1E6;
  --pale:#F4F7FA;
  --line:#E1E7EF;
  --muted:#56667D;
  --muted-2:#8A97A9;
  --white:#FFFFFF;
  --ok:#2E8B62;
  --font:"Manrope", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --shadow:0 1px 2px rgba(19,41,75,.05), 0 14px 32px -18px rgba(19,41,75,.28);
  --ease:cubic-bezier(.2,.7,.2,1);
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  font-family:var(--font);
  color:var(--navy);
  background:var(--white);
  line-height:1.55;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:3px;border-radius:8px}
[hidden]{display:none !important}

/* =========================================================
   2. BARRA SUPERIOR + PROGRESO
   ========================================================= */
.topbar{
  position:sticky;top:0;z-index:30;
  background:rgba(255,255,255,.94);
  -webkit-backdrop-filter:saturate(1.4) blur(10px);
  backdrop-filter:saturate(1.4) blur(10px);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top,0px);
}
.topbar-inner{
  max-width:1160px;margin:0 auto;padding:15px 28px;
  display:flex;align-items:center;justify-content:space-between;gap:20px;
}
.brand{font-weight:800;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.brand span{color:var(--orange)}
.progress{display:flex;align-items:center;gap:14px}
.progress-label{font-size:11px;font-weight:800;letter-spacing:.16em;white-space:nowrap}
.progress-track{width:200px;height:4px;border-radius:99px;background:var(--line);overflow:hidden}
.progress-fill{height:100%;width:0;background:var(--orange);border-radius:99px;transition:width .7s var(--ease)}
.topbar-tag{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}

main{flex:1}
.screen{max-width:1160px;margin:0 auto;padding:56px 28px 72px;animation:enter .5s var(--ease) both}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.site-footer{
  text-align:center;font-size:12px;color:var(--muted-2);
  padding:22px 20px;border-top:1px solid var(--line);
}

/* =========================================================
   3. TIPOGRAFÍA Y BOTONES
   ========================================================= */
.kicker{font-size:12px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--orange)}
.h-xl{font-size:clamp(32px,4.4vw,50px);font-weight:800;letter-spacing:-.032em;line-height:1.06}
.lead{font-size:18px;color:var(--muted);max-width:640px}

.btn{
  appearance:none;border:0;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:12px;
  font-weight:800;font-size:13px;letter-spacing:.15em;text-transform:uppercase;
  padding:17px 28px;border-radius:10px;
  transition:background .2s, color .2s, transform .2s, box-shadow .2s, opacity .2s;
  -webkit-tap-highlight-color:transparent;
}
.btn .arr{display:inline-block;transition:transform .25s var(--ease)}
.btn:hover:not(:disabled) .arr{transform:translateX(4px)}
.btn-primary{background:var(--navy);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--navy-2)}
.btn-accent{background:var(--orange);color:#fff}
.btn-accent:hover:not(:disabled){background:var(--orange-2)}
.btn-outline{background:#fff;color:var(--navy);box-shadow:inset 0 0 0 1.5px var(--navy)}
.btn-outline:hover:not(:disabled){background:var(--pale)}
.btn:disabled{background:#CBD4E0;color:#fff;cursor:not-allowed;box-shadow:none}
.btn:active:not(:disabled){transform:translateY(1px)}

/* =========================================================
   4. PORTADA
   ========================================================= */
.cover{
  display:grid;grid-template-columns:1.12fr .88fr;gap:64px;align-items:center;
  min-height:calc(100vh - 230px);
}
.cover-title{
  font-size:clamp(46px,7.2vw,92px);font-weight:800;letter-spacing:-.045em;line-height:.94;
  text-transform:uppercase;margin:22px 0 26px;
}
.cover-sub{display:flex;align-items:center;gap:14px;font-size:22px;font-weight:600;color:var(--navy)}
.cover-sub::before{content:"";width:34px;height:3px;background:var(--orange);border-radius:3px}
.cover-meta{margin:26px 0 38px;font-size:16px;color:var(--muted);max-width:430px}
.cover-meta strong{color:var(--navy);display:block;font-size:17px}

.cover-card{
  background:var(--navy);color:#fff;border-radius:24px;padding:40px 40px 30px;
  position:relative;overflow:hidden;box-shadow:0 40px 70px -40px rgba(19,41,75,.55);
}
.cover-card::after{
  content:"";position:absolute;right:-90px;top:-90px;width:260px;height:260px;border-radius:50%;
  background:radial-gradient(circle, rgba(232,119,34,.28), rgba(232,119,34,0) 70%);
}
.cc-status{display:flex;align-items:center;gap:10px;font-size:13px;color:rgba(255,255,255,.72);font-weight:600}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 0 rgba(232,119,34,.6);animation:pulse 2.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(232,119,34,.55)}70%{box-shadow:0 0 0 10px rgba(232,119,34,0)}100%{box-shadow:0 0 0 0 rgba(232,119,34,0)}}
.cc-time{font-size:clamp(72px,9.4vw,116px);font-weight:800;letter-spacing:-.05em;line-height:1;margin-top:26px;font-variant-numeric:tabular-nums}
.cc-time .colon{animation:blink 1.6s steps(1) infinite}
@keyframes blink{50%{opacity:.25}}
.cc-place{letter-spacing:.32em;font-size:12px;color:var(--orange);font-weight:800;margin-top:12px}
.cc-lines{list-style:none;margin-top:34px}
.cc-lines li{border-top:1px solid rgba(255,255,255,.13);padding:15px 0;color:rgba(255,255,255,.88);font-size:15.5px;display:flex;align-items:center;gap:14px}
.cc-lines li span{font-size:12px;color:rgba(255,255,255,.45);font-variant-numeric:tabular-nums;font-weight:700;width:18px}

/* =========================================================
   5. ANTES DE EMPEZAR
   ========================================================= */
.intro{max-width:640px;margin:4vh auto 0}
.intro .h-xl{margin:16px 0 22px}
.intro-text p{font-size:18px;color:var(--muted);margin-bottom:14px}
.intro-text p.em{color:var(--navy);font-weight:700}
.field{margin:38px 0 26px}
.field label{display:block;font-weight:800;font-size:16px;margin-bottom:12px}
.input{
  width:100%;padding:18px 20px;font:inherit;font-size:18px;color:var(--navy);
  background:var(--pale);border:1.5px solid var(--line);border-radius:12px;
  transition:border-color .2s, background .2s;
}
.input::placeholder{color:var(--muted-2)}
.input:focus{outline:none;border-color:var(--navy);background:#fff}
.field-note{font-size:13px;color:var(--muted-2);margin-top:10px}

/* =========================================================
   6. DECISIONES · ESTRUCTURA Y RIEL DE TIEMPO
   ========================================================= */
.decision{display:grid;grid-template-columns:190px minmax(0,1fr);gap:64px}
.rail{position:sticky;top:104px;align-self:start}
.rail-clock{display:flex;align-items:baseline}
.rail-time{font-size:54px;font-weight:800;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.rail-ampm{font-size:14px;font-weight:800;color:var(--orange);margin-left:7px}
.rail-place{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin-top:10px;font-weight:800}
.rail-steps{list-style:none;margin-top:34px;border-left:1.5px solid var(--line)}
.rail-steps li{position:relative;padding:7px 0 7px 18px;font-size:13px;color:var(--muted-2);font-variant-numeric:tabular-nums;font-weight:600}
.rail-steps .dot{position:absolute;left:-5.5px;top:50%;margin-top:-4.5px;width:9px;height:9px;border-radius:50%;background:#fff;border:1.5px solid #CBD4E0}
.rail-steps li.done{color:var(--muted)}
.rail-steps li.done .dot{background:var(--navy);border-color:var(--navy)}
.rail-steps li.current{color:var(--navy);font-weight:800}
.rail-steps li.current .dot{background:var(--orange);border-color:var(--orange);box-shadow:0 0 0 4px rgba(232,119,34,.18)}

.decision-main{max-width:740px}
.d-title{font-size:clamp(28px,3.6vw,42px);font-weight:800;letter-spacing:-.032em;line-height:1.1;margin-bottom:14px}
.d-lead{font-size:18px;color:var(--muted);margin-bottom:26px}
.d-lead strong{color:var(--navy)}
.question{
  display:flex;align-items:center;gap:12px;margin:38px 0 14px;
  font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:800;
}
.question::before{content:"";width:20px;height:2px;background:var(--orange);border-radius:2px}
.q-hint{font-size:15px;color:var(--muted);margin:-4px 0 18px}

/* Opciones A/B/C */
.options{display:grid;gap:12px}
.option{
  display:grid;grid-template-columns:36px 1fr;gap:16px;align-items:start;
  width:100%;text-align:left;cursor:pointer;
  padding:19px 22px;background:#fff;border:1.5px solid var(--line);border-radius:14px;
  font-size:16.5px;line-height:1.5;
  transition:border-color .2s, background .2s, opacity .35s, box-shadow .2s;
}
.option:hover:not(:disabled){border-color:var(--navy);box-shadow:var(--shadow)}
.opt-key{
  width:36px;height:36px;border-radius:10px;background:var(--pale);
  display:grid;place-items:center;font-weight:800;font-size:14px;transition:background .2s,color .2s;
}
.opt-text{padding-top:5px}
.option.is-selected{border-color:var(--orange);background:var(--orange-soft)}
.option.is-selected .opt-key{background:var(--orange);color:#fff}
.option.is-dimmed{opacity:.4}
.option:disabled{cursor:default}

/* Tarjeta de mensaje */
.msg{display:flex;gap:14px;padding:18px 20px;background:var(--pale);border:1px solid var(--line);border-radius:14px}
.avatar{
  width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:var(--navy);color:#fff;font-weight:800;font-size:15px;
}
.msg-ops .avatar{background:var(--orange)}
.msg-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;font-size:14px}
.msg-head .role{color:var(--muted);font-size:13px}
.msg-head .time{margin-left:auto;color:var(--muted-2);font-size:12px;font-variant-numeric:tabular-nums}
.msg-text{margin-top:4px;font-size:16.5px}

/* Panel de consecuencia */
.consequence{
  margin-top:28px;padding:26px 28px 24px 30px;border-radius:14px;
  background:var(--pale);position:relative;scroll-margin-top:96px;
  animation:enter .5s var(--ease) both;
}
.consequence::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:3px;border-radius:3px;background:var(--orange)}
.c-label{font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.c-text{font-size:18.5px;line-height:1.55;font-weight:600;margin-top:8px}
.c-then{font-size:16px;color:var(--muted);font-weight:600;margin:22px 0 12px}
.consequence .msg{background:#fff}
.c-actions{margin-top:24px;display:flex;justify-content:flex-end}

/* Decisión 2 · selección doble */
.picks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pick{
  position:relative;text-align:left;cursor:pointer;min-height:118px;
  padding:20px 20px 18px;border:1.5px solid var(--line);border-radius:14px;background:#fff;
  transition:border-color .2s, background .2s, opacity .3s, box-shadow .2s;
}
.pick:hover:not(:disabled){border-color:var(--navy);box-shadow:var(--shadow)}
.pick-title{font-weight:800;font-size:14px;letter-spacing:.08em;text-transform:uppercase;padding-right:36px;line-height:1.35}
.pick-desc{font-size:15px;color:var(--muted);margin-top:8px}
.pick-check{
  position:absolute;top:18px;right:18px;width:24px;height:24px;border-radius:7px;
  border:1.5px solid #CBD4E0;display:grid;place-items:center;background:#fff;transition:all .2s;
}
.pick-check svg{width:14px;height:14px;opacity:0;transition:opacity .2s}
.pick.is-selected{border-color:var(--orange);background:var(--orange-soft)}
.pick.is-selected .pick-check{background:var(--orange);border-color:var(--orange)}
.pick.is-selected .pick-check svg{opacity:1}
.pick.is-unavailable{opacity:.45}
.pick:disabled{cursor:default}
.counter-row{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-top:22px}
.counter{font-size:14px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.counter b{color:var(--orange)}

/* Decisión 3 · lentes */
.option.probe .opt-text{font-size:17.5px;font-weight:600}
.lens-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0 20px}
.lens{
  padding:16px 10px 14px;border-radius:12px;border:1px solid var(--line);background:#fff;
  text-align:center;color:var(--muted-2);font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  transition:all .4s var(--ease);
}
.lens svg{width:40px;height:40px;display:block;margin:0 auto 8px}
.lens.is-active{background:var(--navy);border-color:var(--navy);color:#fff;transform:translateY(-2px)}
.lens.is-active svg{color:var(--orange)}
.reveal-name{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:6px}
.note{font-size:15.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px;margin-top:18px}

/* Decisión 4 · chat */
.chat{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff;box-shadow:var(--shadow)}
.chat-head{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--pale)}
.chat-head .avatar{width:36px;height:36px;font-size:14px;position:relative}
.chat-head .avatar::after{content:"";position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;background:var(--ok);border:2px solid var(--pale)}
.chat-who strong{display:block;font-size:15px;line-height:1.2}
.chat-who span{font-size:12.5px;color:var(--muted)}
.chat-app{margin-left:auto;font-size:12px;color:var(--muted-2);font-weight:700}
.chat-body{padding:22px 18px 20px;display:flex;flex-direction:column;gap:7px;min-height:230px;background:#FBFCFD}
.chat-stamp{align-self:center;font-size:11.5px;color:var(--muted-2);font-weight:700;margin-bottom:6px;font-variant-numeric:tabular-nums}
.bubble{
  max-width:84%;align-self:flex-start;padding:11px 15px;font-size:16px;line-height:1.45;
  background:#fff;border:1px solid var(--line);border-radius:16px 16px 16px 5px;
  animation:pop .35s var(--ease) both;
}
.bubble.out{align-self:flex-end;background:var(--navy);border-color:var(--navy);color:#fff;border-radius:16px 16px 5px 16px}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
.typing{align-self:flex-start;display:flex;gap:4px;padding:13px 15px;background:#fff;border:1px solid var(--line);border-radius:16px}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--muted-2);animation:dot 1.1s infinite}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.reveal-later{animation:enter .45s var(--ease) both}

/* Decisión 5 · slider */
.quote-card{padding:20px 22px;border-radius:14px;background:var(--pale);display:flex;gap:14px}
.slider-card{margin-top:4px;padding:28px 28px 24px;border:1px solid var(--line);border-radius:18px;background:#fff}
.slider-ends{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.slider-end{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.slider-end:last-child{text-align:right}
.slider-end .num{display:block;font-size:40px;letter-spacing:-.04em;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums;transition:color .2s}
.slider-end:last-child .num{color:var(--orange)}
.range{
  -webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:99px;margin:26px 0 10px;
  background:linear-gradient(90deg,var(--navy) 0%, var(--navy) var(--p,50%), var(--orange) var(--p,50%), var(--orange) 100%);
  cursor:pointer;
}
.range:focus{outline:none}
.range:focus-visible{outline:3px solid var(--orange);outline-offset:8px}
.range::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:30px;height:30px;border-radius:50%;
  background:#fff;border:3px solid var(--navy);box-shadow:0 4px 12px rgba(19,41,75,.25);transition:transform .15s;
}
.range:active::-webkit-slider-thumb{transform:scale(1.1)}
.range::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid var(--navy);box-shadow:0 4px 12px rgba(19,41,75,.25)}
.range::-moz-range-track{height:8px;border-radius:99px;background:transparent}
.range:disabled{cursor:default;opacity:.85}
.slider-scale{display:flex;justify-content:space-between;font-size:12px;color:var(--muted-2);font-weight:700;font-variant-numeric:tabular-nums}
.slider-pos{text-align:center;font-size:14px;color:var(--muted);margin-top:14px;font-weight:600}
.slider-pos b{color:var(--navy)}
.feedback-quote{margin-top:18px;font-size:18px;font-weight:700;line-height:1.5;padding-top:16px;border-top:1px solid var(--line)}

/* Decisión 6 */
.status-list{list-style:none;display:grid;gap:10px}
.status-list li{display:flex;align-items:center;gap:14px;padding:14px 18px;background:var(--pale);border-radius:12px;font-weight:600;font-size:16px}
.status-list .chk{width:24px;height:24px;border-radius:50%;background:var(--navy);display:grid;place-items:center;flex:none}
.status-list .chk svg{width:13px;height:13px}
.countdown{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:var(--orange);margin-bottom:12px;font-variant-numeric:tabular-nums}

/* =========================================================
   7. TRANSICIÓN · ANALIZANDO
   ========================================================= */
.analyzing{min-height:62vh;display:grid;place-items:center;text-align:center}
.done-title{font-size:clamp(36px,5.4vw,60px);font-weight:800;letter-spacing:-.04em;line-height:1.05;margin-top:12px}
.hex-loader{width:92px;height:92px;margin:44px auto 0;display:block}
.hex-loader .track{stroke:var(--line)}
.hex-loader .run{stroke:var(--orange);stroke-dasharray:60 240;animation:hexrun 1.6s linear infinite}
@keyframes hexrun{to{stroke-dashoffset:-300}}
.analyzing-text{margin-top:26px;font-size:13px;font-weight:800;letter-spacing:.22em}
.analyzing-sub{margin-top:8px;color:var(--muted);min-height:26px;transition:opacity .3s}

/* =========================================================
   8. RESULTADOS
   ========================================================= */
.results-head{max-width:780px;margin-bottom:38px}
.results-head .h-xl{margin:14px 0 16px}
.panel{border:1px solid var(--line);border-radius:22px;padding:36px;background:#fff;margin-bottom:24px}
.section-label{display:flex;align-items:center;gap:12px;font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;margin-bottom:8px}
.section-label::before{content:"";width:20px;height:2px;background:var(--orange);border-radius:2px}
.panel-intro{color:var(--muted);font-size:15px;margin-bottom:10px}
.sello-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:44px;align-items:center}
.radar-wrap{width:100%;max-width:520px;margin:0 auto}
.radar-wrap canvas{display:block;max-width:100%}
.bars{display:grid;gap:17px}
.bar-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:14.5px;font-weight:600}
.bar-val{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:800;font-size:13px}
.bar-track{height:6px;background:var(--pale);border-radius:99px;overflow:hidden;margin-top:7px}
.bar-fill{height:100%;width:0;background:var(--navy);border-radius:99px;transition:width 1.2s var(--ease)}
.bar.is-strength .bar-fill{background:var(--orange)}
.bar-tag{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:2px 7px;border-radius:99px;margin-left:8px;vertical-align:2px}
.bar-tag.s{background:var(--orange);color:#fff}
.bar-tag.o{background:var(--pale);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.bars-note{font-size:12.5px;color:var(--muted-2);margin-top:4px}

.insight-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:24px}
.insight{border-radius:22px;padding:32px 32px 30px}
.insight .kicker{font-size:11.5px}
.insight h3{font-size:23px;font-weight:800;letter-spacing:-.02em;line-height:1.2;margin:12px 0 12px}
.insight p{font-size:15.5px;line-height:1.6}
.insight.strength{background:var(--navy);color:#fff}
.insight.strength p{color:rgba(255,255,255,.84)}
.insight.opportunity{background:var(--orange-soft);box-shadow:inset 0 0 0 1px #F5D8BE}
.insight.opportunity .kicker{color:var(--orange-2)}
.insight.opportunity p{color:#4a4f5c}
.balance-note{font-size:14px;color:var(--muted);margin:-8px 0 24px}

.lenses-result{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:22px 0 24px}
.lens-card{position:relative;border:1px solid var(--line);border-radius:16px;padding:22px 22px 20px;transition:all .3s}
.lens-card svg{width:44px;height:44px;color:var(--navy)}
.lens-card h4{font-size:17px;font-weight:800;margin-top:10px}
.lens-card p{font-size:14px;color:var(--muted);margin-top:4px;min-height:44px}
.lens-meter{height:5px;background:var(--pale);border-radius:99px;margin-top:14px;overflow:hidden}
.lens-meter i{display:block;height:100%;width:0;background:#9AA9BD;border-radius:99px;transition:width 1.1s var(--ease)}
.lens-card.is-dominant{border-color:var(--orange);background:var(--orange-soft)}
.lens-card.is-dominant svg{color:var(--orange)}
.lens-card.is-dominant .lens-meter{background:#fff}
.lens-card.is-dominant .lens-meter i{background:var(--orange)}
.lens-tag{position:absolute;top:16px;right:16px;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;background:var(--orange);color:#fff;padding:4px 9px;border-radius:99px}
.mirada-text{font-size:19px;font-weight:700;line-height:1.5;max-width:780px}
.cta-center{text-align:center;margin:44px 0 8px}
.btn-eye{padding:21px 36px;font-size:14px}
.btn-eye .eye{font-size:18px;letter-spacing:0}

/* =========================================================
   9. REVEAL DEL ICEBERG
   ========================================================= */
.ice{max-width:860px;margin:0 auto;border-radius:26px;overflow:hidden;box-shadow:0 40px 80px -40px rgba(11,26,49,.6)}
.ice-sky{background:var(--pale);padding:48px 24px 26px;text-align:center}
.ice-sky .h-xl{font-size:clamp(28px,3.6vw,40px);margin:10px 0 30px}
.ice-sea{position:relative;background:linear-gradient(180deg,#1E4274 0%,#13294B 45%,#0A172C 100%);padding:34px 22px 56px;text-align:center;color:#fff}
.waterline{display:block;width:100%;height:26px;margin-top:-1px;background:var(--pale)}
.waterline svg{display:block;width:100%;height:26px}
.water-label{font-size:11.5px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.55);margin-bottom:22px}
.ice-item{
  margin:0 auto;padding:16px 20px;border-radius:12px;
  font-weight:800;font-size:14px;letter-spacing:.09em;text-transform:uppercase;line-height:1.35;
  opacity:0;animation:iceIn .65s var(--ease) forwards;
}
.ice-item small{display:block;text-transform:none;letter-spacing:0;font-weight:500;font-size:13.5px;margin-top:4px;opacity:.72}
.ice-item.top{background:#fff;color:var(--navy);max-width:320px;box-shadow:var(--shadow)}
.ice-sea .ice-item{background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.ice-sea .ice-item.last{box-shadow:inset 0 0 0 1.5px var(--orange);background:rgba(232,119,34,.12)}
.ice-arrow{display:block;color:var(--orange);font-size:18px;line-height:1;margin:10px 0;opacity:0;animation:iceIn .5s var(--ease) forwards}
@keyframes iceIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.ice-close{margin-top:44px;opacity:0;animation:iceIn .8s var(--ease) forwards}
.ice-close h2{font-size:clamp(22px,2.8vw,30px);font-weight:800;letter-spacing:-.02em;line-height:1.3;max-width:620px;margin:0 auto}
.ice-close p{margin-top:14px;font-size:20px;font-weight:800;color:var(--orange)}
.ice-close .btn{margin-top:32px}

/* =========================================================
   10. COMPROMISO
   ========================================================= */
.commit{max-width:760px;margin:0 auto}
.commit .h-xl{margin:14px 0 18px}
.commit-context{font-size:18px;color:var(--muted);margin-bottom:6px}
.commit-context strong{color:var(--navy)}
.commit-opt{grid-template-columns:24px 1fr;align-items:center}
.radio{width:22px;height:22px;border-radius:50%;border:1.5px solid #CBD4E0;display:grid;place-items:center;background:#fff;transition:all .2s}
.radio::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff;transform:scale(0);transition:transform .2s}
.commit-opt.is-selected{border-color:var(--orange);background:var(--orange-soft)}
.commit-opt.is-selected .radio{background:var(--orange);border-color:var(--orange)}
.commit-opt.is-selected .radio::after{transform:scale(1)}
.other-wrap{display:grid;grid-template-columns:24px auto 1fr;gap:16px;align-items:center;padding:14px 22px;border:1.5px solid var(--line);border-radius:14px;cursor:pointer;transition:border-color .2s, background .2s}
.other-wrap.is-selected{border-color:var(--orange);background:var(--orange-soft)}
.other-wrap.is-selected .radio{background:var(--orange);border-color:var(--orange)}
.other-wrap.is-selected .radio::after{transform:scale(1)}
.other-label{font-weight:800;font-size:14px;letter-spacing:.1em}
.other-input{width:100%;border:0;border-bottom:1.5px solid #CBD4E0;background:transparent;padding:8px 2px;font:inherit;font-size:16.5px;color:var(--navy)}
.other-input:focus{outline:none;border-bottom-color:var(--navy)}
.commit-actions{display:flex;justify-content:flex-end;margin-top:28px}

/* =========================================================
   11. REPORTE FINAL
   ========================================================= */
.report{max-width:1000px;margin:0 auto;border-radius:26px;overflow:hidden;background:#fff;box-shadow:0 1px 0 var(--line), 0 40px 80px -44px rgba(19,41,75,.45);border:1px solid var(--line)}
.report-head{position:relative;background:var(--navy);color:#fff;padding:40px 44px 38px;overflow:hidden}
.report-head::after{content:"";position:absolute;right:-60px;bottom:-120px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(232,119,34,.25),rgba(232,119,34,0) 70%)}
.report-head .brand{font-size:14px}
.report-date{position:absolute;top:42px;right:44px;font-size:13px;color:rgba(255,255,255,.65);font-weight:600}
.report-title{font-size:clamp(40px,5.4vw,64px);font-weight:800;letter-spacing:-.045em;line-height:1;margin-top:34px}
.report-name{font-size:24px;font-weight:700;margin-top:12px}
.report-sub{color:rgba(255,255,255,.72);margin-top:4px;font-size:15.5px}
.report-body{display:grid;grid-template-columns:1fr 1fr;gap:40px;padding:40px 44px 28px;align-items:start}
.r-item{padding:0 0 20px;margin-bottom:20px;border-bottom:1px solid var(--line)}
.r-item:last-child{border-bottom:0;margin-bottom:0}
.r-item .kicker{font-size:11px}
.r-item h4{font-size:19px;font-weight:800;letter-spacing:-.01em;margin-top:6px;line-height:1.3}
.r-item p{font-size:14.5px;color:var(--muted);margin-top:4px}
.r-commit{margin-top:10px;background:var(--pale);border-radius:12px;padding:16px 18px;box-shadow:inset 3px 0 0 var(--orange);font-weight:700;font-size:16.5px;line-height:1.45}
.report-quote{margin:0 44px 34px;padding:26px 30px;background:var(--pale);border-radius:16px;font-size:18.5px;font-weight:700;line-height:1.55}
.report-foot{display:flex;justify-content:space-between;gap:12px 28px;flex-wrap:wrap;padding:22px 44px 26px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.report-foot .disclaimer{max-width:560px;font-style:italic}
.report-foot .foot-brand{font-weight:700;color:var(--navy)}
.actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:34px}
.pdf-status{text-align:center;margin-top:14px;color:var(--muted);font-size:14px;min-height:22px}
.pdf-status.error{color:#B3261E}

/* =========================================================
   12. RESPONSIVE
   ========================================================= */
@media (max-width:960px){
  .cover{grid-template-columns:1fr;gap:44px;min-height:auto}
  .decision{grid-template-columns:1fr;gap:26px}
  .rail{position:static;display:flex;align-items:center;flex-wrap:wrap;gap:6px 18px;padding-bottom:18px;border-bottom:1px solid var(--line)}
  .rail-time{font-size:36px}
  .rail-place{margin-top:0}
  .rail-steps{display:flex;gap:8px;margin:0 0 0 auto;border-left:0}
  .rail-steps li{padding:0;width:9px;height:9px}
  .rail-steps li .t{display:none}
  .rail-steps .dot{position:static;margin:0;display:block}
  .sello-grid,.insight-grid,.report-body{grid-template-columns:1fr}
  .report-body{gap:24px}
}
@media (max-width:640px){
  .topbar-inner{padding:12px 18px}
  .topbar-tag{display:none}
  .progress{gap:10px}
  .progress-label{font-size:10px;letter-spacing:.12em}
  .progress-track{width:70px}
  .screen{padding:30px 18px 56px}
  .cover-card{padding:30px 26px 22px}
  .picks{grid-template-columns:1fr}
  .pick{min-height:0}
  .lens-strip{gap:6px}
  .lens{font-size:10px;letter-spacing:.06em;padding:12px 4px}
  .lens svg{width:32px;height:32px}
  .lenses-result{grid-template-columns:1fr}
  .lens-card p{min-height:0}
  .panel{padding:26px 20px}
  .insight{padding:26px 22px}
  .option{padding:16px;font-size:15.5px;gap:14px}
  .consequence{padding:22px 20px 20px 24px}
  .c-text{font-size:17px}
  .c-actions .btn,.commit-actions .btn,.counter-row .btn,.btn-wide-m{width:100%}
  .slider-card{padding:22px 18px 20px}
  .slider-end .num{font-size:32px}
  .other-wrap{grid-template-columns:24px 1fr;padding:14px 16px}
  .other-input{grid-column:1 / -1}
  .report-head{padding:30px 22px}
  .report-date{position:static;display:block;margin-top:10px}
  .report-title{margin-top:22px}
  .report-body{padding:28px 22px 16px}
  .report-quote{margin:0 22px 26px;padding:22px;font-size:17px}
  .report-foot{padding:20px 22px}
  .actions .btn{width:100%}
  .ice-sky{padding:36px 18px 22px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-delay:0ms !important;transition-duration:.01ms !important;scroll-behavior:auto !important}
}
</style>
</head>

<script>

const D1 = {
  options:[
    { key:'A', text:'Estoy entrando a otra reunión. Mándame por Teams un resumen y lo revisamos después.',

/* ---------- Decisión 2 (elegir 2 de 4) ---------- */

  items:[

const D5 = {
  bands:[
    { id:'hoy', min:0,  max:34,  score:{car:5, cli:4, vis:1}, mirada:{pista:1},

/* =========================================================
   2. PUNTAJE MÁXIMO POSIBLE (para normalizar 0–100)
   ========================================================= */
function zeroScores(){ return Object.fromEntries(COMPS.map(c => [c.id, 0])); }

const MAX = (function computeMax(){
  const max = zeroScores();
  const single = [D1.options, D3.options, D4.options, D6.options, D5.bands];
  COMPS.forEach(c => {
    single.forEach(list => { max[c.id] += Math.max(0, ...list.map(o => o.score[c.id] || 0)); });
    const top = D2.items.map(i => i.score[c.id] || 0).sort((a,b) => b - a);
    max[c.id] += top[0] + top[1];
    if (max[c.id] === 0) max[c.id] = 1; // protección ante división por cero
  });
  return max;
})();

function addScore(obj){ Object.entries(obj || {}).forEach(([k,v]) => { state.scores[k] += v; }); }
function addMirada(obj){ Object.entries(obj || {}).forEach(([k,v]) => { state.mirada[k] += v; }); }

/* =========================================================
   4. UTILIDADES DE RENDER
   ========================================================= */
const app = document.getElementById('app');
let screenToken = 0;       // invalida temporizadores de pantallas anteriores
let radars = [];           // radares activos (para redibujar al cambiar tamaño)

function esc(s){
  return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function later(fn, ms){
  const t = screenToken;
  return setTimeout(() => { if (t === screenToken) fn(); }, ms);
}
const reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const T = ms => reducedMotion ? Math.min(ms, 60) : ms;

function setProgress(step){
  const p = document.getElementById('progress');
  if (!step){ p.hidden = true; return; }
  p.hidden = false;
  document.getElementById('progressLabel').textContent = `DECISIÓN ${step} DE 6`;
  document.getElementById('progressFill').style.width = (step / 6 * 100) + '%';
}

function show(html, step){
  screenToken++;
  radars = [];
  app.innerHTML = `<section class="screen">${html}</section>`;
  setProgress(step || null);
  window.scrollTo(0, 0);
}

function $(sel, root){ return (root || app).querySelector(sel); }
function $$(sel, root){ return [...(root || app).querySelectorAll(sel)]; }

function scrollIntoViewSoft(el){
  if (!el) return;
  later(() => el.scrollIntoView({ behavior: reducedMotion ? 'auto' : 'smooth', block:'start' }), 80);
}

/* Riel lateral con la hora y la línea de tiempo de la mañana */
function rail(step){
  return `<aside class="rail" aria-label="Hora del caso">
    <div class="rail-clock"><span class="rail-time">${TIMES[step-1]}</span><span class="rail-ampm">AM</span></div>
    <div class="rail-place">Casa Matriz</div>
    <ol class="rail-steps">
      ${TIMES.map((t,i) => `<li class="${i+1 < step ? 'done' : i+1 === step ? 'current' : ''}"><span class="dot"></span><span class="t">${t}</span></li>`).join('')}
    </ol>
  </aside>`;
}
function decisionShell(step, inner){
  return `<div class="decision">${rail(step)}<div class="decision-main">${inner}</div></div>`;
}
function messageCard(name, role, text, time, variant){
  return `<div class="msg ${variant ? 'msg-' + variant : ''}">
    <div class="avatar" aria-hidden="true">${esc(name.charAt(0))}</div>
    <div>
      <div class="msg-head"><strong>${esc(name)}</strong><span class="role">${esc(role)}</span><span class="time">${esc(time)}</span></div>
      <p class="msg-text">“${esc(text)}”</p>
    </div>
  </div>`;
}
function optionsHTML(list, extraClass){
  return `<div class="options" id="opts">
    ${list.map(o => `<button type="button" class="option ${extraClass || ''}" data-key="${o.key}" aria-pressed="false">
      <span class="opt-key">${o.key}</span><span class="opt-text">${extraClass === 'probe' ? '“' + esc(o.text) + '”' : '“' + esc(o.text) + '”'}</span>
    </button>`).join('')}
  </div>`;
}
/** Activa un grupo de opciones de elección única y lo bloquea tras elegir. */
function bindOptions(container, onPick){
  const btns = $$('.option', container);
  btns.forEach(b => b.addEventListener('click', () => {
    if (container.dataset.locked) return;
    container.dataset.locked = '1';
    btns.forEach(x => {
      const sel = x === b;
      x.classList.toggle('is-selected', sel);
      x.classList.toggle('is-dimmed', !sel);
      x.setAttribute('aria-pressed', String(sel));
      x.disabled = true;
    });
    onPick(b.dataset.key);
  }));
}
/** Muestra el panel de consecuencia y conecta su botón. */
function showConsequence(slot, { label, text, extra, btnLabel, onNext }){
  slot.innerHTML = `<div class="consequence" id="consequence" aria-live="polite">
    <p class="c-label">${esc(label || 'Lo que ocurre')}</p>
    ${text ? `<p class="c-text">${esc(text)}</p>` : ''}
    ${extra || ''}
    <div class="c-actions"><button type="button" class="btn btn-primary" id="nextBtn">${esc(btnLabel || 'Continuar')} <span class="arr">→</span></button></div>
  </div>`;
  $('#nextBtn', slot).addEventListener('click', onNext, { once:true });
  scrollIntoViewSoft($('#consequence', slot));
}

  let sel = [], locked = false;
  const picks = $$('.pick'), btn = $('#confirmBtn'), counter = $('#counter');

  function update(){
    picks.forEach(p => {
      const on = sel.includes(p.dataset.id);
      p.classList.toggle('is-selected', on);
      p.setAttribute('aria-pressed', String(on));
      p.classList.toggle('is-unavailable', !on && sel.length === 2);

    btn.disabled = sel.length !== 2;
  }
  picks.forEach(p => p.addEventListener('click', () => {
    if (locked) return;
    const id = p.dataset.id;
    if (sel.includes(id)) sel = sel.filter(x => x !== id);
    else if (sel.length < 2) sel.push(id);
    update();
  }));
  btn.addEventListener('click', () => {
    if (locked || sel.length !== 2) return;
    locked = true;
    const ordered = D2.items.filter(i => sel.includes(i.id));
    ordered.forEach(i => { addScore(i.score); addMirada(i.mirada); });

    const key = ordered.map(i => i.id).join('+');

      onNext: renderD3
    });
  });
  update();
}

/* =========================================================
   14. CÁLCULO DE RESULTADOS
   ========================================================= */
function computeResults(){
  const norm = {};
  COMPS.forEach(c => { norm[c.id] = Math.max(0, Math.min(100, Math.round(state.scores[c.id] / MAX[c.id] * 100))); });

  // Fortaleza: máximo relativo. Oportunidad: mínimo relativo entre las restantes.
  const desc = [...COMPS].sort((a,b) => norm[b.id] - norm[a.id]);
  const strength = desc[0].id;
  const asc = COMPS.filter(c => c.id !== strength).sort((a,b) => norm[a.id] - norm[b.id]);
  const opportunity = asc[0].id;
  const spread = norm[strength] - norm[opportunity];

  return { norm, strength, opportunity, balanced: spread < 10, mirada: computeMirada() };
}

function computeMirada(){
  const m = state.mirada;
  const total = LENS_ORDER.reduce((s,k) => s + m[k], 0) || 1;
  const sorted = [...LENS_ORDER].sort((a,b) => m[b] - m[a]);
  const [a,b,c] = sorted;
  let dominant;
  if (m[a] === m[b] && m[b] === m[c]) dominant = [...LENS_ORDER];
  else if (m[a] - m[b] <= 1 && m[b] > m[c]) dominant = LENS_ORDER.filter(k => k === a || k === b);
  else dominant = [a];
  const key = dominant.join('-');
  const label = dominant.map(k => dominant.length > 1 ? LENSES[k].short : LENSES[k].name).join('–');
  const share = Object.fromEntries(LENS_ORDER.map(k => [k, m[k] / total]));
  return { key, dominant, label, text: MIRADA_TEXT[key], share, max: m[a] / total };
}

/* =========================================================
   15. RADAR (Canvas, reutilizado en pantalla y PDF)
   ========================================================= */
function wrapLines(ctx, text, maxW){
  const words = text.split(' ');
  const lines = [];
  let line = '';
  words.forEach(w => {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line){ lines.push(line); line = w; }
    else line = test;
  });
  if (line) lines.push(line);
  return lines;
}

/**
 * Dibuja el radar hexagonal.
 * opts.fixed: tamaño fijo (PDF). Si no, se adapta al contenedor.
 */
function drawRadar(canvas, values, opts){
  const o = Object.assign({ progress:1, fixed:false, width:1100, height:1000, fontSize:null, showValues:false, bg:null }, opts || {});
  let w, h, dpr;
  if (o.fixed){
    w = o.width; h = o.height; dpr = 1;
    canvas.width = w; canvas.height = h;
  } else {
    const box = canvas.parentElement.getBoundingClientRect();
    w = Math.max(260, Math.floor(box.width));
    h = Math.round(w * 0.9);
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  if (o.bg){ ctx.fillStyle = o.bg; ctx.fillRect(0, 0, w, h); }

  const n = COMPS.length;
  const cx = w / 2, cy = h / 2;
  const R = o.fixed ? w * 0.26 : (w < 420 ? w * 0.22 : w * 0.26);
  const fs = o.fontSize || Math.max(10, Math.min(13, w * 0.028));
  const ang = i => -Math.PI / 2 + i * 2 * Math.PI / n;
  const pt = (i, r) => [cx + Math.cos(ang(i)) * r, cy + Math.sin(ang(i)) * r];

  // Fondo del hexágono
  ctx.beginPath();
  for (let i = 0; i < n; i++){ const [x,y] = pt(i, R); i ? ctx.lineTo(x,y) : ctx.moveTo(x,y); }
  ctx.closePath();
  ctx.fillStyle = '#F4F7FA';
  ctx.fill();

  // Anillos
  for (let r = 1; r <= 4; r++){
    ctx.beginPath();
    for (let i = 0; i < n; i++){ const [x,y] = pt(i, R * r / 4); i ? ctx.lineTo(x,y) : ctx.moveTo(x,y); }
    ctx.closePath();
    ctx.strokeStyle = r === 4 ? '#C9D3E0' : '#E1E7EF';
    ctx.lineWidth = o.fixed ? 2 : 1;
    ctx.stroke();
  }
  // Ejes
  for (let i = 0; i < n; i++){
    const [x,y] = pt(i, R);
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(x, y);
    ctx.strokeStyle = '#E1E7EF'; ctx.lineWidth = o.fixed ? 2 : 1; ctx.stroke();
  }

  // Polígono de datos
  const vals = COMPS.map(c => Math.max(0.02, (values[c.id] || 0) / 100) * o.progress);
  ctx.beginPath();
  vals.forEach((v,i) => { const [x,y] = pt(i, R * v); i ? ctx.lineTo(x,y) : ctx.moveTo(x,y); });
  ctx.closePath();
  ctx.fillStyle = 'rgba(232,119,34,0.20)';
  ctx.fill();
  ctx.strokeStyle = '#E87722';
  ctx.lineWidth = o.fixed ? 5 : 2.2;
  ctx.lineJoin = 'round';
  ctx.stroke();
  vals.forEach((v,i) => {
    const [x,y] = pt(i, R * v);
    ctx.beginPath(); ctx.arc(x, y, o.fixed ? 9 : 4.2, 0, Math.PI * 2);
    ctx.fillStyle = '#fff'; ctx.fill();
    ctx.lineWidth = o.fixed ? 4.5 : 2; ctx.strokeStyle = '#13294B'; ctx.stroke();
  });

  // Etiquetas
  const gap = fs * 1.1;
  const lh = fs * 1.28;
  COMPS.forEach((c, i) => {
    const a = ang(i), cos = Math.cos(a), sin = Math.sin(a);
    const lx = cx + cos * (R + gap), ly = cy + sin * (R + gap);
    let align = 'center', maxW = w * 0.46;
    if (cos > 0.3){ align = 'left'; maxW = w - lx - 6; }
    else if (cos < -0.3){ align = 'right'; maxW = lx - 6; }
    ctx.font = `700 ${fs}px Manrope, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif`;
    const lines = wrapLines(ctx, c.name, Math.max(60, maxW));
    const totalLines = lines.length + (o.showValues ? 1 : 0);
    let y0;
    if (sin < -0.5) y0 = ly - (totalLines - 1) * lh;         // etiqueta superior
    else if (sin > 0.5) y0 = ly + lh * 0.55;                  // etiqueta inferior
    else y0 = ly - ((totalLines - 1) * lh) / 2;               // laterales
    ctx.textAlign = align;
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#13294B';
    lines.forEach((ln, k) => ctx.fillText(ln, lx, y0 + k * lh));
    if (o.showValues){
      ctx.font = `800 ${fs}px Manrope, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif`;
      ctx.fillStyle = '#E87722';
      ctx.fillText(String(values[c.id]), lx, y0 + lines.length * lh);
    }
  });
}

/** Registra y anima un radar en pantalla. */
function mountRadar(canvas, values){
  const entry = { canvas, values };
  radars.push(entry);
  if (reducedMotion){ drawRadar(canvas, values); return; }
  const start = performance.now(), dur = 1200, token = screenToken;
  const step = now => {
    if (token !== screenToken) return;
    const t = Math.min(1, (now - start) / dur);
    const e = 1 - Math.pow(1 - t, 3);
    drawRadar(canvas, values, { progress:e });
    if (t < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function redrawRadars(){ radars.forEach(r => drawRadar(r.canvas, r.values)); }
let resizeTimer;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(redrawRadars, 150); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(redrawRadars);

/* =========================================================
   20. GENERACIÓN DEL PDF (jsPDF)
   ========================================================= */
function loadScript(src){
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src; s.async = true;
    s.onload = resolve; s.onerror = () => reject(new Error('No se pudo cargar ' + src));
    document.head.appendChild(s);
  });
}
async function getJsPDF(){
  if (window.jspdf && window.jspdf.jsPDF) return window.jspdf.jsPDF;
  const sources = [
    'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
    'https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js'
  ];
  for (const src of sources){
    try { await loadScript(src); if (window.jspdf && window.jspdf.jsPDF) return window.jspdf.jsPDF; }
    catch(e){ /* se intenta la siguiente fuente */ }
  }
  throw new Error('jsPDF no disponible');
}

/** Texto compatible con las fuentes estándar del PDF (Latin-1). */
function pdfSafe(s){
  return String(s).normalize('NFC')
    .replace(/[“”«»]/g, '"').replace(/[‘’]/g, "'")
    .replace(/[–—]/g, '-').replace(/…/g, '...')
    .replace(/[^\x0A\x20-\x7E\u00A0-\u00FF]/g, '');
}

function pdfFileName(){
  const clean = state.name.normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^A-Za-z0-9 ]/g, '').trim().split(/\s+/).filter(Boolean).map(w => w.charAt(0).toUpperCase() + w.slice(1)).join('_');
  return `Mi_Sello_BEX_${clean || 'Participante'}.pdf`;
}

async function downloadPDF(btn){
  const status = $('#pdfStatus');
  status.classList.remove('error');
  status.textContent = 'Generando tu reporte…';
  btn.disabled = true;
  try {
    const JsPDF = await getJsPDF();
    const doc = new JsPDF({ unit:'mm', format:'a4', orientation:'portrait' });
    buildPDF(doc);
    const name = pdfFileName();
    doc.save(name);
    status.textContent = `Reporte descargado: ${name}`;
  } catch(err){
    console.error(err);
    status.classList.add('error');
    status.textContent = 'No se pudo generar el PDF porque el generador no cargó. Revisa tu conexión a internet y vuelve a pulsar el botón.';
  } finally {
    btn.disabled = false;
  }
}

function buildPDF(doc){
  const r = state.results;
  const NAVY = [19,41,75], ORANGE = [232,119,34], PALE = [244,247,250], MUTED = [86,102,125], LINE = [225,231,239], SOFT = [253,241,230];
  const L = 18, RGT = 192, W = RGT - L;
  const date = todayStr();
  const lineH = pt => pt * 0.3528 * 1.32;

  const header = () => {
    doc.setFillColor(...NAVY); doc.rect(0, 0, 210, 24, 'F');
    doc.setFillColor(...ORANGE); doc.rect(0, 24, 210, 1.2, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(255,255,255);
    doc.text('BancoEstado', L, 14.5);
    const bw = doc.getTextWidth('BancoEstado ');
    doc.setTextColor(...ORANGE); doc.text('Express', L + bw, 14.5);
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(196,206,222);
    doc.text('ESCUELA DE LIDERAZGO BEX', RGT, 14.5, { align:'right' });
  };
  const footer = page => {
    doc.setDrawColor(...LINE); doc.setLineWidth(0.3); doc.line(L, 280, RGT, 280);
    doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(...MUTED);
    doc.text(pdfSafe('Escuela de Liderazgo BEX · BancoEstado Express'), L, 286);
    doc.text(`${page} / 2`, RGT, 286, { align:'right' });
  };
  const kicker = (txt, x, y, color) => {
    doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(...(color || ORANGE));
    doc.text(pdfSafe(txt).toUpperCase(), x, y, { charSpace:0.6 });
  };

  /* ---------- PÁGINA 1 ---------- */
  header();
  kicker('Una mañana cualquiera', L, 37);
  doc.setFont('helvetica','bold'); doc.setFontSize(28); doc.setTextColor(...NAVY);
  doc.text('MI SELLO BEX', L, 49);
  doc.setFontSize(15); doc.text(pdfSafe(state.name), L, 58);
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(...MUTED);
  doc.text(pdfSafe(date), L, 64.5);
  doc.text(pdfSafe('Lo que revelaron mis decisiones en Una mañana cualquiera.'), RGT, 64.5, { align:'right' });

  // Radar como imagen
  const c = document.createElement('canvas');
  drawRadar(c, r.norm, { fixed:true, width:1100, height:960, fontSize:27, showValues:true, bg:'#FFFFFF' });
  const img = c.toDataURL('image/png');
  const imgW = 138, imgH = imgW * 960 / 1100;
  doc.addImage(img, 'PNG', (210 - imgW) / 2, 70, imgW, imgH);
  let y = 70 + imgH + 4;

  // Tarjetas fortaleza / oportunidad
  const colW = (W - 6) / 2;
  const boxContent = (compId, textFeedback) => {
    doc.setFont('helvetica','bold'); doc.setFontSize(11.5);
    const t = doc.splitTextToSize(pdfSafe(COMP[compId].name), colW - 12);
    doc.setFont('helvetica','normal'); doc.setFontSize(9);
    const b = doc.splitTextToSize(pdfSafe(textFeedback), colW - 12);
    return { t, b, h: 12 + t.length * lineH(11.5) + 2 + b.length * lineH(9) + 5 };
  };
  const s = boxContent(r.strength, FEEDBACK[r.strength].strength);
  const o = boxContent(r.opportunity, FEEDBACK[r.opportunity].opportunity);
  const boxH = Math.max(40, s.h, o.h);
  const drawBox = (x, data, label, dark) => {
    if (dark){ doc.setFillColor(...NAVY); } else { doc.setFillColor(...SOFT); }
    doc.roundedRect(x, y, colW, boxH, 3, 3, 'F');
    kicker(label, x + 6, y + 8.5, ORANGE);
    doc.setFont('helvetica','bold'); doc.setFontSize(11.5);
    if (dark) doc.setTextColor(255,255,255); else doc.setTextColor(...NAVY);
    doc.text(data.t, x + 6, y + 15.5);
    const yb = y + 15.5 + data.t.length * lineH(11.5) + 1.5;
    doc.setFont('helvetica','normal'); doc.setFontSize(9);
    if (dark) doc.setTextColor(214,222,234); else doc.setTextColor(70,76,90);
    doc.text(data.b, x + 6, yb);
  };
  drawBox(L, s, 'Fortaleza que mostraste', true);
  drawBox(L + colW + 6, o, 'Una oportunidad', false);
  y += boxH + 8;

  // Disclaimer
  doc.setFont('helvetica','italic'); doc.setFontSize(8); doc.setTextColor(...MUTED);
  const disc = doc.splitTextToSize(pdfSafe('Este resultado no constituye una evaluación de desempeño ni un diagnóstico de liderazgo. Refleja exclusivamente las decisiones tomadas dentro de este caso de aprendizaje.'), W);
  doc.text(disc, L, Math.min(y, 272 - disc.length * lineH(8)));
  footer(1);

  /* ---------- PÁGINA 2 ---------- */
  doc.addPage();
  header();
  kicker('Pista de baile · Balcón · Iceberg', L, 37);
  doc.setFont('helvetica','bold'); doc.setFontSize(24); doc.setTextColor(...NAVY);
  doc.text('MI MANERA DE MIRAR', L, 48);

  const lw = (W - 12) / 3, ly = 56, lh = 40;
  LENS_ORDER.forEach((k, i) => {
    const x = L + i * (lw + 6);
    const dom = r.mirada.dominant.includes(k);
    doc.setFillColor(...(dom ? SOFT : PALE));
    doc.roundedRect(x, ly, lw, lh, 3, 3, 'F');
    if (dom){ doc.setDrawColor(...ORANGE); doc.setLineWidth(0.6); doc.roundedRect(x, ly, lw, lh, 3, 3, 'S'); }
    doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(...NAVY);
    doc.text(pdfSafe(LENSES[k].name), x + 5, ly + 10);
    if (dom){ kicker('Predominó', x + 5, ly + 16, ORANGE); }
    doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(...MUTED);
    doc.text(doc.splitTextToSize(pdfSafe(LENSES[k].desc), lw - 10), x + 5, ly + 22);
    const pct = r.mirada.max ? r.mirada.share[k] / r.mirada.max : 0;
    doc.setFillColor(...(dom ? [255,255,255] : LINE)); doc.roundedRect(x + 5, ly + lh - 7, lw - 10, 2, 1, 1, 'F');
    doc.setFillColor(...(dom ? ORANGE : [154,169,189])); doc.roundedRect(x + 5, ly + lh - 7, Math.max(2, (lw - 10) * pct), 2, 1, 1, 'F');
  });

  y = ly + lh + 11;
  doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(...NAVY);
  const mt = doc.splitTextToSize(pdfSafe(r.mirada.text), W);
  doc.text(mt, L, y);
  y += mt.length * lineH(12) + 3;
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(...MUTED);
  const nt = doc.splitTextToSize(pdfSafe('Ninguna mirada es suficiente por sí sola. Liderar también implica saber cuándo moverse entre la Pista, el Balcón y el Iceberg.'), W);
  doc.text(nt, L, y);
  y += nt.length * lineH(9.5) + 14;

  kicker('El sello comienza mañana', L, y);
  y += 10;
  doc.setFont('helvetica','bold'); doc.setFontSize(24); doc.setTextColor(...NAVY);
  doc.text('MI COMPROMISO BEX', L, y);
  y += 8;
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(...MUTED);
  doc.text(pdfSafe(`Oportunidad trabajada: ${COMP[r.opportunity].name}`), L, y);
  y += 6;

  doc.setFont('helvetica','bold'); doc.setFontSize(13.5);
  const ct = doc.splitTextToSize(pdfSafe(state.commitment), W - 20);
  const cH = 16 + ct.length * lineH(13.5);
  doc.setFillColor(...NAVY); doc.roundedRect(L, y, W, cH, 3, 3, 'F');
  doc.setFillColor(...ORANGE); doc.rect(L, y + 4, 1.4, cH - 8, 'F');
  doc.setTextColor(255,255,255);
  doc.text(ct, L + 10, y + 11);
  y += cH + 12;

  doc.setFillColor(...PALE);
  doc.setFont('helvetica','italic'); doc.setFontSize(11);
  const q = doc.splitTextToSize(pdfSafe('"Liderar no consiste en encontrar siempre una respuesta perfecta. También implica comprender qué estás privilegiando con cada decisión y qué impacto puede tener."'), W - 20);
  const qH = 12 + q.length * lineH(11);
  if (y + qH > 262) y = 262 - qH;
  doc.roundedRect(L, y, W, qH, 3, 3, 'F');
  doc.setTextColor(...NAVY);
  doc.text(q, L + 10, y + 9.5);
  y += qH + 10;

  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(...MUTED);
  doc.text(pdfSafe(`${state.name} · ${date}`), L, Math.min(y, 274));
  footer(2);
}

/* =========================================================
   21. REINICIO COMPLETO
   ========================================================= */
function restart(){
  state = freshState();
  try { sessionStorage.removeItem('bex_nombre'); } catch(e){ /* sin almacenamiento */ }
  renderCover();
}

/* =========================================================
   22. INICIO
   ========================================================= */
renderCover();
</script>
</body>
</html>
